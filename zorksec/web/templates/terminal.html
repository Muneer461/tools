{% extends "base.html" %}
{% block title %}ZorkSec Terminal - {{ title }}{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
<style>
  body { background: #000; margin: 0; }
  .term-head {
    color: var(--accent); font-family: monospace; padding: 10px 14px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--accent) 22%, var(--panel)), var(--panel));
    display:flex; justify-content: space-between; align-items:center;
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    box-shadow: 0 2px 18px -6px var(--accent);
    animation: zs-fade-up .4s ease both;
  }
  .term-head .brand { font-weight: 700; letter-spacing: .5px; }
  .term-head .brand .dot { color: var(--accent); animation: zs-blink 1.4s infinite; }
  #term { height: calc(100vh - 46px); padding: 6px;
          animation: zs-pop .4s ease both; }
  #status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
</style>
{% endblock %}
{% block body %}
<div class="term-head">
  <span class="brand">ZorkSec <span class="dot">&#9679;</span> {{ title }}</span>
  <span id="status"><span class="spinner"></span> connecting…</span>
</div>
<div id="term"></div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const term = new Terminal({ cursorBlink: true, fontSize: 14,
    theme: { background: '#000000', foreground: '#d6ffe6' } });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));
  fit.fit();

  const socket = io();
  const payload = {
    tool: {{ slug | tojson }},
    action: {{ action | tojson }},
    cmd: {{ custom | tojson }}
  };

  socket.on('connect', () => {
    document.getElementById('status').innerHTML = '<span style="color:var(--ok)">&#9679;</span> connected';
    socket.emit('resize', { rows: term.rows, cols: term.cols });
    socket.emit('start', payload);
    term.focus();
  });
  socket.on('output', (msg) => term.write(msg.data));
  socket.on('exit', (msg) => {
    document.getElementById('status').innerHTML =
      '<span style="color:var(--warn)">&#9679;</span> exited (' + msg.code + ')';
  });
  socket.on('disconnect', () =>
    document.getElementById('status').innerHTML =
      '<span style="color:var(--danger)">&#9679;</span> disconnected');

  term.onData(data => socket.emit('input', { data }));
  addEventListener('resize', () => {
    fit.fit();
    socket.emit('resize', { rows: term.rows, cols: term.cols });
  });
</script>
{% endblock %}
