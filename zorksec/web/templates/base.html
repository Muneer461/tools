<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ZorkSec{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='zorksec.css') }}">
  {% if theme %}
  <style>
    :root {
      --accent: {{ theme.accent }};
      --bg: {{ theme.bg }};
      --panel: {{ theme.panel }};
    }
  </style>
  {% endif %}
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
