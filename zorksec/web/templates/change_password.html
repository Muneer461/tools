{% extends "base.html" %}
{% block title %}ZorkSec - Change Password{% endblock %}
{% block body %}
<div style="max-width: 380px; margin: 12vh auto;">
  <div class="panel">
    <h2>Change your password</h2>
    <p style="color: var(--muted); font-size: 13px;">
      For safety you must replace the default password before using ZorkSec.
      Use at least 8 characters.
    </p>
    {% if error %}<div class="warn-box" style="margin-bottom:12px;">{{ error }}</div>{% endif %}
    <form method="post">
      <input name="old_password" type="password" placeholder="Current password"
             style="width:100%; margin-bottom:10px;">
      <input name="new_password" type="password" placeholder="New password"
             style="width:100%; margin-bottom:10px;">
      <input name="confirm_password" type="password" placeholder="Confirm new password"
             style="width:100%; margin-bottom:14px;">
      <button type="submit" style="width:100%;">Update password</button>
    </form>
  </div>
</div>
{% endblock %}
